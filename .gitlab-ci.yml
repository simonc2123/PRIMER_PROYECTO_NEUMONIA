# Pipeline CI/CD - Sistema de Detección de Neumonía
# Integrado con GitHub mediante espejo de repositorio en GitLab.
#
# Etapas:
#   1. build  → instala dependencias y verifica el entorno
#   2. test   → lint de código + pruebas unitarias con pytest
#   3. deploy → construye y publica la imagen Docker en el registro de GitLab

stages:
  - build
  - test
  - deploy

# ─── Variables globales ────────────────────────────────────────────────────────
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DOCKER_IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  DOCKER_IMAGE_LATEST: "$CI_REGISTRY_IMAGE:latest"

# Cache de dependencias pip entre jobs del mismo pipeline
.pip_cache: &pip_cache
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pip
      - venv/

# ─── STAGE: build ─────────────────────────────────────────────────────────────
install-dependencies:
  stage: build
  image: python:3.12-slim
  <<: *pip_cache
  before_script:
    - apt-get update -qq && apt-get install -y -qq libgl1 libglib2.0-0 > /dev/null
    - python -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip --quiet
  script:
    - echo "Instalando dependencias del proyecto..."
    - pip install --quiet -r requirements-docker.txt
    - pip install --quiet pytest flake8
    - echo "Verificando importaciones principales..."
    - python -c "import numpy, cv2, flask; print('Dependencias OK')"
    - echo "Build completado."
  artifacts:
    paths:
      - venv/
    expire_in: 1 hour

# ─── STAGE: test ──────────────────────────────────────────────────────────────
lint:
  stage: test
  image: python:3.12-slim
  <<: *pip_cache
  needs: [install-dependencies]
  before_script:
    - source venv/bin/activate
  script:
    - echo "Analizando calidad del código con flake8..."
    - flake8 src/ tests/ api.py cli.py
      --max-line-length=100
      --exclude=__pycache__,.git,venv
      --statistics
    - echo "Sin problemas de lint."

unit-tests:
  stage: test
  image: python:3.12-slim
  <<: *pip_cache
  needs: [install-dependencies]
  before_script:
    - apt-get update -qq && apt-get install -y -qq libgl1 libglib2.0-0 > /dev/null
    - source venv/bin/activate
  script:
    - echo "Ejecutando pruebas unitarias con pytest..."
    - pytest tests/ -v --tb=short --ignore=tests/test_grad_cam.py
    - echo "Pruebas completadas."
  # test_grad_cam.py se ignora porque requiere el modelo entrenado (.h5/.keras),
  # que no se versiona en el repositorio. Agrégalo como artefacto o variable
  # de CI si deseas incluirlo en el pipeline.
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    when: always
    reports:
      junit: report.xml
    expire_in: 1 week

# ─── STAGE: deploy ────────────────────────────────────────────────────────────
build-docker:
  stage: deploy
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  needs: [lint, unit-tests]
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - echo "Construyendo imagen Docker..."
    - docker build -t "$DOCKER_IMAGE" -t "$DOCKER_IMAGE_LATEST" .
    - echo "Publicando imagen en el registro de GitLab..."
    - docker push "$DOCKER_IMAGE"
    - docker push "$DOCKER_IMAGE_LATEST"
    - echo "Imagen disponible en: $DOCKER_IMAGE"
  rules:
    # Solo ejecutar en la rama main/master y cuando hay cambios reales
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
